version: "3.8"

services:
  # 1. Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: nextjs_mysql
    restart: always
    command: --max-connections=1000
    environment:
      MYSQL_ROOT_PASSWORD: root # Password database (bebas diganti)
      MYSQL_DATABASE: my_app_db # Nama database awal
    ports:
      - "3306:3306" # Membuka port ke laptop agar bisa diakses
    volumes:
      - db_data:/var/lib/mysql # Agar data tidak hilang saat docker dimatikan

  # 2. Service phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: nextjs_pma
    restart: always
    ports:
      - "8080:80" # Akses via browser di localhost:8080
    environment:
      PMA_HOST: db # Konek ke service 'db' di atas
    depends_on:
      - db

volumes:
  db_data:
