name: POS System CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: "mysql://root:root@localhost:3306/pos_test"

    - name: Run Lint
      run: npm run lint

    - name: Run Tests
      run: npm run test -- --run
      env:
        DATABASE_URL: "mysql://root:root@localhost:3306/pos_test"
        BETTER_AUTH_SECRET: "ci-test-secret"
        BETTER_AUTH_URL: "http://localhost:3000"

    - name: Build Next.js App
      run: npm run build
      env:
        DATABASE_URL: "mysql://root:root@localhost:3306/pos_test"
        BETTER_AUTH_SECRET: "ci-test-secret"
        BETTER_AUTH_URL: "http://localhost:3000"
        NEXT_PUBLIC_PUSHER_KEY: "test-key"
        NEXT_PUBLIC_PUSHER_HOST: "localhost"
        NEXT_PUBLIC_PUSHER_PORT: 6001
        NEXT_PUBLIC_PUSHER_SCHEME: "http"
