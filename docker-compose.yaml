version: "3.8"

services:
  # 1. Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: skripsi_nextjs_mysql
    restart: always
    command: --max-connections=1000
    environment:
      MYSQL_ROOT_PASSWORD: root # Password database (bebas diganti)
      MYSQL_DATABASE: my_app_db # Nama database awal
    ports:
      - "3307:3306" # Membuka port ke laptop agar bisa diakses
    volumes:
      - db_data:/var/lib/mysql # Agar data tidak hilang saat docker dimatikan

  # 2. Service phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: skripsi_nextjs_pma
    restart: always
    ports:
      - "8081:80" # Akses via browser di localhost:8081
    environment:
      PMA_HOST: db # Konek ke service 'db' di atas
    depends_on:
      - db

  # 3. Service Soketi (Self-hosted Pusher compatibility)
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: skripsi_nextjs_soketi
    restart: always
    ports:
      - "6002:6001"   # WebSocket (Soketi listens on 6001 internally)
      - "9602:9601"   # Metrics (Soketi metrics on 9601 internally)
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${NEXT_PUBLIC_PUSHER_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_SECRET}
      SOKETI_DEFAULT_APP_MAX_CONNS: "100"
      SOKETI_DEBUG: "1"

volumes:
  db_data:
